<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de recados</title>
    <style>
        /* seletor universal */
        *{box-sizing: border-box;}
        body{
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }
        header{
            background: #e30613;
            color: #fff;
            padding: 24px;
            text-align: center;
        }
        main{width: min(700px, 92%); margin: 208px auto;}
        form, article{
            background: #fff;
            padding: 18px;
            margin-bottom: 14px;
            border-radius: 8px;
        }
        input, textarea, button{
            width: 100%;
            padding: 11px;
            margin-bottom: 14px;
            border-radius: 8px;
        }
        textarea{min-height: 90px; resize: vertical;}
        button{
            background: #e30613;
            color: #fff;
            border: 0;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover{background: #b9040e;}
        h2{margin-top: 28px;}
        article{border-left: 5px solid #e30613;}
        article{min-height:22px; font-height:bold;}
    </style>
</head>
<body>
    <!-- header>h1{Mural de recados}+p{Front + Java + JDBC + MySQL} -->
    <header>
        <h1>Mural de recados</h1>
        <p>Front + Java + JDBC + MySQL</p>
    </header>
    <main>
        <form id="form-recado">
            <label for="autor">Nome</label>
            <input id="autor" name="autor" maxlength="80" required>

            <label for="menssagem">Recado</label>
            <textarea name="menssagem" id="menssagem" maxlength="255" required></textarea>
            <button type="submit">Publicar recado</button>
            <p id="aviso"></p>
            </form>
            <section id="lista-recados"></section>
    </main>
    <script>
        const formulario = document.querySelector("#form-recado")
        const lista = document.querySelector("#lista-recados")
        const aviso = document.querySelector("#aviso")

        async function carregarRecados() {
            const resposta = await fetch("/api/recados")
            const recados = await resposta.json()
            lista.innerHTML = ""

            for(const recado of recados){
                const cartao = document.createElement("article")
                const autor = document.createElement("strong")
                const menssagem = document.createElement("p")

                autor.textContent = recado.autor
                menssagem.textContent = recado.menssagem
                cartao.append(autor,menssagem)
                lista.appendChild(cartao)
            }
        }

        formulario.addEventListener("submit", async function (evento) {
            evento.preventDefault()
            aviso.textContent = "Salvando..."

            const dados = new URLSearchParams(new FormData(formulario))
            const resposta = await fetch("/api/recados",{
                method: "POST",
                body:dados
            })
            if(resposta.ok){
                formulario.reset()
                aviso.textContent = "Recado cadastrado com sucesso!!!"
                await carregarRecados()
            }else{
                aviso.textContent = "Não foi possivel carregar o recado!!!"
            }
        })
        carregarRecados()
    </script>
</body>
</html>
